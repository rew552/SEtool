<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RDP Generator</title>
      <link rel="stylesheet" href="../assets/css/common.css">
  <link rel="stylesheet" href="../assets/css/nav.css">
  <style>


        * { box-sizing: border-box; }
        body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font-family: var(--sans);
            font-size: 13px;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        header {
            padding: 10px 18px;
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            z-index: 10;
        }

        .logo {
            font-family: var(--mono);
            font-weight: 600;
            font-size: 15px;
            color: var(--accent);
        }
        .logo span { color: var(--accent2); }

        main {
            display: grid;
            grid-template-columns: 4fr 6fr;
            flex: 1;
            overflow: hidden;
            min-height: 0;
        }

        .pane {
            display: flex;
            flex-direction: column;
            border-right: 1px solid var(--border);
            overflow: hidden;
            min-height: 0;
        }
        .pane-right { flex: 1; background: var(--bg); overflow-y: hidden; }

        .pane-header {
            padding: 5px 10px;
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            min-height: 30px;
        }
        .pane-title {
            display: flex;
            align-items: center;
            gap: 6px;
            font-family: var(--sans);
            font-size: 11px;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.8px;
        }
        .dot { font-size: 16px; line-height: 1; margin-right: 4px; border-radius: 50%; display: inline-block; width: 6px; height: 6px; background: var(--accent); }
        .dot.green { background: var(--accent2); }

        .pane-body {
            padding: 16px;
            flex: 1;
            overflow-y: auto;
        }

        .field { margin-bottom: 16px; }
        .field label {
            display: block;
            font-size: 11px;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.8px;
            margin-bottom: 6px;
        }
        .field-hint { font-size: 10px; font-weight: normal; margin-left: 4px; opacity: 0.8; text-transform:none; letter-spacing:0; }

        textarea, input[type="text"], input[type="number"], select {
            width: 100%;
            padding: 7px 10px;
            background: var(--surface2);
            border: 1px solid var(--border);
            color: var(--text);
            border-radius: 3px;
            font-family: var(--mono);
            font-size: 13px;
            outline: none;
        }
        textarea { resize: vertical; min-height: 100px; font-family: var(--mono); line-height: 1.5; }
        input[type="text"]:focus, select:focus, textarea:focus { border-color: var(--accent); }

        .checkbox-group { 
            display: flex; 
            align-items: center; 
            gap: 8px; 
            margin-bottom: 12px; 
            cursor: pointer; 
            user-select: none;
        }
        .checkbox-group input { width: auto; cursor: pointer; margin: 0; }
        .checkbox-group label { margin: 0; font-size: 12px; cursor: pointer; color: var(--text); }

        details {
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: 3px;
            margin-bottom: 16px;
            overflow: hidden;
        }
        summary {
            padding: 8px 12px;
            cursor: pointer;
            font-size: 11px;
            color: var(--muted);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            user-select: none;
            outline: none;
            background: var(--surface);
            border-bottom: 1px solid transparent;
        }
        summary:hover { background: var(--border); }
        details[open] summary { border-bottom: 1px solid var(--border); }
        .details-content { padding: 16px; }

        /* 結果グリッド */
        .result-grid-wrapper {
            height: 100%;
            overflow-y: auto;
            padding: 16px;
        }
        
        .result-grid {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 4px;
            display: flex;
            flex-direction: column;
        }
        .card-header {
            padding: 10px 12px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--surface2);
        }
        .card-title { font-weight: bold; font-family: var(--sans); font-size: 12px; display:flex; align-items:center; gap:6px; overflow: hidden; text-overflow: ellipsis; white-space:nowrap; }
        .card-host { font-size: 10px; color: var(--accent); font-family: var(--mono); }
        .card-body { padding: 12px; flex: 1; }
        
        .card-details {
            border: 1px solid var(--border);
            background: var(--bg);
            border-radius: 3px;
            margin: 0;
            overflow: hidden;
        }
        .card-details summary {
            background: var(--surface2);
            padding: 6px 10px;
            font-size: 10px;
            color: var(--dim);
            text-transform: none;
            letter-spacing: 0;
        }
        .card-code {
            font-family: var(--mono);
            font-size: 11px;
            white-space: pre-wrap;
            color: var(--accent2);
            margin: 0;
            padding: 10px;
            background: var(--bg);
            max-height: 150px;
            overflow-y: auto;
        }

        .btn {
            padding: 6px 12px;
            border-radius: 3px;
            border: 1px solid var(--border);
            background: var(--surface2);
            color: var(--text);
            font-size: 11px;
            font-family: var(--sans);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.15s;
            flex: 1;
        }
        .btn:hover { background: var(--border); }
        .btn-accent { border-color: var(--accent); color: var(--accent); }
        .btn-accent:hover { background: var(--accent); color: var(--bg); }

        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: var(--dim);
            font-size: 12px;
            text-align: center;
            padding: 40px;
            grid-column: 1 / -1;
        }
        
        /* ── Toast ── */
        .toast {
            position: fixed;
            bottom: 18px; right: 18px;
            padding: 7px 14px;
            background: var(--surface2);
            border: 1px solid var(--accent2);
            border-radius: 3px;
            font-family: var(--sans);
            font-size: 12px;
            color: var(--accent2);
            opacity: 0;
            pointer-events: none;
            z-index: 999;
            transition: opacity .18s;
        }
        .toast.show { opacity: 1; }

    </style>
</head>
<body>
    <header>
        <div class="logo">rdp<span>.gen</span></div>
    </header>
    <main>
        <div class="pane">
            <div class="pane-header">
                <div class="pane-title"><span class="dot"></span>TARGET & CONFIG</div>
            </div>
            <div class="pane-body">
                <!-- ターゲットリスト -->
                <div class="field">
                    <label>ターゲットリスト <span class="field-hint">— 表示名, 接続先IP (改行区切り / カンマ省略時はホスト名がファイル名)</span></label>
                    <textarea id="targetList" placeholder="Webサーバー01, 192.168.10.51&#10;Webサーバー02, 192.168.10.52&#10;192.168.10.100" oninput="updateAll()"></textarea>
                </div>

                <!-- 全般 -->
                <div class="field">
                    <label>全般 <span class="field-hint">— ユーザー情報 (共通)</span></label>
                    <div style="display: flex; gap: 8px;">
                        <input type="text" id="username" placeholder="ユーザー名" oninput="updateAll()">
                        <input type="text" id="domain" placeholder="ドメイン" oninput="updateAll()">
                    </div>
                </div>

                <!-- 画面 -->
                <details open>
                    <summary>画面</summary>
                    <div class="details-content">
                        <div class="field">
                            <label style="text-transform:none;">画面モード</label>
                            <select id="screenMode" onchange="onScreenModeChange()">
                                <option value="2" selected>全画面 (Full Screen)</option>
                                <option value="1">ウィンドウ (Windowed)</option>
                            </select>
                        </div>
                        <div class="field" id="resolutionField" style="display:none;">
                            <label style="text-transform:none;">解像度</label>
                            <div style="display: flex; gap: 8px; align-items: center;">
                                <input type="number" id="resWidth" placeholder="1920" value="1920" oninput="updateAll()">
                                <span style="color:var(--muted); font-size:11px;">x</span>
                                <input type="number" id="resHeight" placeholder="1080" value="1080" oninput="updateAll()">
                            </div>
                        </div>
                        <div class="field">
                            <label style="text-transform:none;">色深度 <span class="field-hint">— session bpp (Default: 32)</span></label>
                            <select id="sessionBpp" onchange="updateAll()">
                                <option value="32" selected>32bit (最高品質)</option>
                                <option value="24">24bit</option>
                                <option value="16">16bit (1600万色)</option>
                                <option value="15">15bit (3万2千色)</option>
                                <option value="8">8bit (256色)</option>
                            </select>
                        </div>
                        <div class="checkbox-group">
                            <input type="checkbox" id="useMultimon" checked onchange="updateAll()">
                            <label for="useMultimon">マルチモニター <span style="color:var(--muted);font-size:10px;">— use multimon</span></label>
                        </div>
                        <div class="checkbox-group">
                            <input type="checkbox" id="smartSizing" onchange="updateAll()">
                            <label for="smartSizing">スマートサイジング (ウィンドウに合わせて拡縮) <span style="color:var(--muted);font-size:10px;">— smart sizing</span></label>
                        </div>
                        <div class="checkbox-group">
                            <input type="checkbox" id="pinConnectionBar" checked onchange="updateAll()">
                            <label for="pinConnectionBar">全画面時に接続バーを固定表示 <span style="color:var(--muted);font-size:10px;">— pinconnectionbar</span></label>
                        </div>
                    </div>
                </details>

                <!-- ローカルリソース -->
                <details>
                    <summary>ローカルリソース</summary>
                    <div class="details-content">
                        <div class="field">
                            <label style="text-transform:none;">キーボード (Windowsキーの組み合わせ) <span class="field-hint">— keyboardhook (Default: 2)</span></label>
                            <select id="keyboardHook" onchange="updateAll()">
                                <option value="2" selected>全画面表示のときのみリモートに適用</option>
                                <option value="1">常にリモートコンピューターに適用</option>
                                <option value="0">このコンピューターに適用</option>
                            </select>
                        </div>
                        <div class="field">
                            <label style="text-transform:none;">リモートオーディオ 再生 <span class="field-hint">— audiomode (Default: 0)</span></label>
                            <select id="audioMode" onchange="updateAll()">
                                <option value="0" selected>このコンピューターで再生</option>
                                <option value="1">リモートコンピューターで再生</option>
                                <option value="2">再生しない</option>
                            </select>
                        </div>
                        <div class="field">
                            <label style="text-transform:none;">リモートオーディオ 録音 (マイク) <span class="field-hint">— audiocapturemode (Default: 0=OFF)</span></label>
                            <select id="audioCaptureMode" onchange="updateAll()">
                                <option value="0" selected>このコンピューターから録音しない</option>
                                <option value="1">このコンピューターから録音する</option>
                            </select>
                        </div>
                        <div class="field" style="margin-top:8px;">
                            <label style="text-transform:none; font-weight:600; color:var(--text);">ローカルデバイスとリソース</label>
                        </div>
                        <div class="checkbox-group">
                            <input type="checkbox" id="redirectClipboard" checked onchange="updateAll()">
                            <label for="redirectClipboard">クリップボード <span style="color:var(--muted);font-size:10px;">— redirectclipboard (Default: 0)</span></label>
                        </div>
                        <div class="checkbox-group">
                            <input type="checkbox" id="redirectPrinters" onchange="updateAll()">
                            <label for="redirectPrinters">プリンター <span style="color:var(--muted);font-size:10px;">— redirectprinters (Default: 0)</span></label>
                        </div>
                        <div class="checkbox-group">
                            <input type="checkbox" id="redirectSmartCards" checked onchange="updateAll()">
                            <label for="redirectSmartCards">スマートカード <span style="color:var(--muted);font-size:10px;">— redirectsmartcards (Default: 1)</span></label>
                        </div>
                        <div class="checkbox-group">
                            <input type="checkbox" id="redirectComPorts" onchange="updateAll()">
                            <label for="redirectComPorts">シリアルポート (COMポート) <span style="color:var(--muted);font-size:10px;">— redirectcomports (Default: 0)</span></label>
                        </div>
                        <div class="field">
                            <label style="text-transform:none;">ドライブ <span class="field-hint">— drivestoredirect:s: (Default: 空=共有なし)</span></label>
                            <select id="redirectDrivesMode" onchange="onDrivesModeChange()">
                                <option value="none" selected>共有しない (空)</option>
                                <option value="all">全ドライブを共有 (*)</option>
                                <option value="dynamic">後から接続したドライブのみ (DynamicDrives)</option>
                                <option value="specify">ドライブを指定する</option>
                            </select>
                            <input type="text" id="redirectDrivesSpecify" placeholder="例: C:\;D:\;" style="margin-top:6px; display:none;" oninput="updateAll()">
                        </div>
                        <div class="field">
                            <label style="text-transform:none;">ビデオキャプチャデバイス (Webカメラ) <span class="field-hint">— camerastoredirect:s:</span></label>
                            <select id="cameraRedirect" onchange="updateAll()">
                                <option value="none" selected>リダイレクトしない</option>
                                <option value="all">全カメラをリダイレクト (*)</option>
                            </select>
                        </div>
                    </div>
                </details>

                <!-- エクスペリエンス -->
                <details>
                    <summary>エクスペリエンス</summary>
                    <div class="details-content">
                        <div class="field">
                            <label style="text-transform:none;">接続速度に応じてパフォーマンスを最適化 <span class="field-hint">— connection type</span></label>
                            <select id="connectionType" onchange="onConnectionTypeChange()">
                                <option value="auto" selected>自動検出</option>
                                <option value="6">6: LAN (10Mbps以上)</option>
                                <option value="5">5: WAN (10Mbps以上・高遅延)</option>
                                <option value="4">4: 高速ブロードバンド (2〜10Mbps)</option>
                                <option value="3">3: 衛星回線 (高遅延)</option>
                                <option value="2">2: 低速ブロードバンド (256Kbps〜2Mbps)</option>
                                <option value="1">1: モデム (56Kbps)</option>
                                <option value="7">7: カスタム (下記を個別指定)</option>
                            </select>
                        </div>
                        <div id="experienceCustomGroup" style="display:none;">
                            <div class="checkbox-group">
                                <input type="checkbox" id="expWallpaper" checked onchange="updateAll()">
                                <label for="expWallpaper">デスクトップの背景 <span style="color:var(--muted);font-size:10px;">— disable wallpaper:i:0</span></label>
                            </div>
                            <div class="checkbox-group">
                                <input type="checkbox" id="expFontSmooth" onchange="updateAll()">
                                <label for="expFontSmooth">フォントスムージング <span style="color:var(--muted);font-size:10px;">— allow font smoothing:i:1</span></label>
                            </div>
                            <div class="checkbox-group">
                                <input type="checkbox" id="expFullDrag" checked onchange="updateAll()">
                                <label for="expFullDrag">ドラッグ中にウィンドウの内容を表示 <span style="color:var(--muted);font-size:10px;">— disable full window drag:i:0</span></label>
                            </div>
                            <div class="checkbox-group">
                                <input type="checkbox" id="expMenuAnim" onchange="updateAll()">
                                <label for="expMenuAnim">メニューとウィンドウのアニメーション <span style="color:var(--muted);font-size:10px;">— disable menu anims:i:0</span></label>
                            </div>
                            <div class="checkbox-group">
                                <input type="checkbox" id="expThemes" checked onchange="updateAll()">
                                <label for="expThemes">デスクトップの視覚スタイル (テーマ) <span style="color:var(--muted);font-size:10px;">— disable themes:i:0</span></label>
                            </div>
                            <div class="checkbox-group">
                                <input type="checkbox" id="expBitmapCache" checked onchange="updateAll()">
                                <label for="expBitmapCache">永続的なビットマップキャッシュ <span style="color:var(--muted);font-size:10px;">— bitmapcachepersistenable:i:1</span></label>
                            </div>
                        </div>
                        <div class="checkbox-group" style="margin-top:8px;">
                            <input type="checkbox" id="autoReconnect" checked onchange="updateAll()">
                            <label for="autoReconnect">接続が切れた場合は自動的に再接続する <span style="color:var(--muted);font-size:10px;">— autoreconnection enabled</span></label>
                        </div>
                    </div>
                </details>

                <!-- 詳細設定 -->
                <details>
                    <summary>詳細設定</summary>
                    <div class="details-content">
                        <div class="field">
                            <label style="text-transform:none;">サーバー認証 <span class="field-hint">— authentication level (Default: 3)</span></label>
                            <select id="authLevel" onchange="updateAll()">
                                <option value="2" selected>2: 警告を表示して接続するか確認</option>
                                <option value="0">0: 認証失敗でも警告なしで接続</option>
                                <option value="1">1: 認証失敗時は接続しない</option>
                                <option value="3">3: 要件なし (Default)</option>
                            </select>
                        </div>
                        <div class="field" style="margin-top:8px;">
                            <label style="text-transform:none; font-weight:600; color:var(--text);">RDゲートウェイ</label>
                        </div>
                        <div class="field">
                            <label style="text-transform:none;">利用方法 <span class="field-hint">— gatewayusagemethod (Default: 0)</span></label>
                            <select id="gatewayUsage" onchange="updateAll()">
                                <option value="0" selected>使用しない</option>
                                <option value="1">常に使用する</option>
                                <option value="2">自動 (直接接続できない場合のみ)</option>
                                <option value="4">使用しない (ローカルアドレスをバイパス)</option>
                            </select>
                        </div>
                        <div class="field">
                            <label style="text-transform:none;">ゲートウェイ ホスト名</label>
                            <input type="text" id="gatewayHost" placeholder="gw.example.com" oninput="updateAll()">
                        </div>
                        <div class="checkbox-group">
                            <input type="checkbox" id="promptCredentialOnce" checked onchange="onPromptCredentialOnceChange()">
                            <label for="promptCredentialOnce">ゲートウェイとセッションに同じ資格情報を使う <span style="color:var(--muted);font-size:10px;">— promptcredentialonce (Default: 1)</span></label>
                        </div>
                        <div class="field">
                            <label style="text-transform:none;">ゲートウェイ ユーザー名 <span class="field-hint">— 別の認証情報が必要な場合のみ</span></label>
                            <input type="text" id="gatewayUsername" placeholder="gwuser" oninput="updateAll()">
                        </div>
                        <div class="field">
                            <label style="text-transform:none;">ゲートウェイ ドメイン</label>
                            <input type="text" id="gatewayDomain" placeholder="gw-domain" oninput="updateAll()">
                        </div>
                        <div class="field">
                            <label style="text-transform:none;">ゲートウェイ 認証方式 <span class="field-hint">— gatewaycredentialssource (Default: 0)</span></label>
                            <select id="gatewayCredSource" onchange="updateAll()">
                                <option value="0" selected>0: NTLM (パスワード)</option>
                                <option value="1">1: スマートカード</option>
                                <option value="2">2: 現在のサインイン資格情報を使用</option>
                                <option value="4">4: 任意 (ユーザーが後で選択)</option>
                                <option value="5">5: Cookie認証</option>
                            </select>
                        </div>
                    </div>
                </details>
            </div>
        </div>

        <div class="pane pane-right">
            <div class="pane-header" style="padding: 5px 16px;">
                <div class="pane-title"><span class="dot green"></span>RESULTS</div>
                <div id="countLabel" style="font-size: 11px; color: var(--muted); font-family:var(--mono);">0 files</div>
            </div>
            <div class="result-grid-wrapper">
                <div id="resultGrid" class="result-grid">
                    <div class="empty-state">
                        左ペインのターゲットリストにホストを入力してください
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div class="toast" id="toast"></div>

    <script>
        // ── UI: 画面モード切り替え
        function onScreenModeChange() {
            const v = document.getElementById('screenMode').value;
            document.getElementById('resolutionField').style.display = (v === '1') ? 'block' : 'none';
            updateAll();
        }

        // ── UI: ドライブ共有モード切り替え
        function onDrivesModeChange() {
            const mode = document.getElementById('redirectDrivesMode').value;
            document.getElementById('redirectDrivesSpecify').style.display = (mode === 'specify') ? 'block' : 'none';
            updateAll();
        }

        // ── UI: 接続タイプ切り替え (エクスペリエンス)
        function onConnectionTypeChange() {
            const ct = document.getElementById('connectionType').value;
            document.getElementById('experienceCustomGroup').style.display = (ct === '7') ? 'block' : 'none';
            updateAll();
        }

        // ── UI: 「同じ資格情報を使う」チェック → GW専用認証フィールドのグレーアウト
        function onPromptCredentialOnceChange() {
            const same = document.getElementById('promptCredentialOnce').checked;
            ['gatewayUsername', 'gatewayDomain', 'gatewayCredSource'].forEach(id => {
                const el = document.getElementById(id);
                el.disabled      = same;
                el.style.opacity = same ? '0.4' : '1';
                el.style.cursor  = same ? 'not-allowed' : '';
                const field = el.closest('.field');
                if (field) field.style.opacity = same ? '0.4' : '1';
            });
            updateAll();
        }

        // ── トースト通知
        function showToast(msg) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.classList.add('show');
            if (t._tid) clearTimeout(t._tid);
            t._tid = setTimeout(() => t.classList.remove('show'), 2200);
        }

        // ── XSSエスケープ（共通）
        function escapeHtml(s) {
            return (s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;');
        }

        function updateAll() {
            const listText = document.getElementById('targetList').value.trim();
            const resultGrid = document.getElementById('resultGrid');
            const countLabel = document.getElementById('countLabel');

            if (!listText) {
                resultGrid.innerHTML = '<div class="empty-state">左ペインのターゲットリストにホストを入力してください</div>';
                countLabel.textContent = '0 files';
                return;
            }

            const lines = listText.split('\n');
            resultGrid.innerHTML = '';
            let count = 0;

            lines.forEach(line => {
                // 空行やスペースだけの行を除外
                if (!line.trim()) return;

                const parts = line.split(',');
                let filename = parts[0].trim();
                let host = parts.length > 1 ? parts[1].trim() : filename;
                
                if (!filename || !host) return;

                count++;
                const rdpContent = generateRDP(host);
                const card = createCard(filename, host, rdpContent);
                resultGrid.appendChild(card);
            });

            countLabel.textContent = count + ' files';
        }

        function generateRDP(host) {
            let lines = [];

            // ── 必須
            lines.push('full address:s:' + host);
            lines.push('server port:i:3389');

            // ── 全般
            const user = document.getElementById('username').value.trim();
            const domain = document.getElementById('domain').value.trim();
            if (user)   lines.push('username:s:' + user);
            if (domain) lines.push('domain:s:' + domain);

            // ── 画面 (Default: screen mode id=2, session bpp=32, use multimon=1, pinconnectionbar=1)
            const smode = document.getElementById('screenMode').value;
            if (smode !== '2') lines.push('screen mode id:i:' + smode);
            if (smode === '1') {
                const w = document.getElementById('resWidth').value;
                const h = document.getElementById('resHeight').value;
                if (w) lines.push('desktopwidth:i:' + w);
                if (h) lines.push('desktopheight:i:' + h);
            }
            const bpp = document.getElementById('sessionBpp').value;
            if (bpp !== '32') lines.push('session bpp:i:' + bpp);

            const useMultimon = document.getElementById('useMultimon').checked ? 1 : 0;
            if (useMultimon !== 1) lines.push('use multimon:i:' + useMultimon);

            const smartSizing = document.getElementById('smartSizing').checked ? 1 : 0;
            if (smartSizing !== 0) lines.push('smart sizing:i:' + smartSizing);

            const pinBar = document.getElementById('pinConnectionBar').checked ? 1 : 0;
            if (pinBar !== 1) lines.push('pinconnectionbar:i:' + pinBar);

            // ── ローカルリソース
            // keyboardhook Default:2
            const kbHook = document.getElementById('keyboardHook').value;
            if (kbHook !== '2') lines.push('keyboardhook:i:' + kbHook);

            // audiomode Default:0
            const audio = document.getElementById('audioMode').value;
            if (audio !== '0') lines.push('audiomode:i:' + audio);

            // audiocapturemode Default:0
            const audioCapture = document.getElementById('audioCaptureMode').value;
            if (audioCapture !== '0') lines.push('audiocapturemode:i:' + audioCapture);

            // redirectclipboard Default:0
            const clip = document.getElementById('redirectClipboard').checked ? 1 : 0;
            if (clip !== 0) lines.push('redirectclipboard:i:' + clip);

            // redirectprinters Default:0
            const print = document.getElementById('redirectPrinters').checked ? 1 : 0;
            if (print !== 0) lines.push('redirectprinters:i:' + print);

            // redirectsmartcards Default:1
            const scard = document.getElementById('redirectSmartCards').checked ? 1 : 0;
            if (scard !== 1) lines.push('redirectsmartcards:i:' + scard);

            // redirectcomports Default:0
            const comPorts = document.getElementById('redirectComPorts').checked ? 1 : 0;
            if (comPorts !== 0) lines.push('redirectcomports:i:' + comPorts);

            // drivestoredirect Default: 空
            const drivesMode = document.getElementById('redirectDrivesMode').value;
            if (drivesMode === 'all') {
                lines.push('drivestoredirect:s:*');
            } else if (drivesMode === 'dynamic') {
                lines.push('drivestoredirect:s:DynamicDrives');
            } else if (drivesMode === 'specify') {
                const specified = document.getElementById('redirectDrivesSpecify').value.trim();
                if (specified) lines.push('drivestoredirect:s:' + specified);
            }

            // camerastoredirect Default: 空
            const cam = document.getElementById('cameraRedirect').value;
            if (cam === 'all') lines.push('camerastoredirect:s:*');

            // ── エクスペリエンス
            const ct = document.getElementById('connectionType').value;
            if (ct === 'auto') {
                // 自動: networkautodetect=1(default), bandwidthautodetect=1 を明示
                // Default値なので何も出力しない
            } else if (ct === '7') {
                // カスタム: 個別項目を出力
                lines.push('connection type:i:7');
                lines.push('networkautodetect:i:0');
                const wallpaper = document.getElementById('expWallpaper').checked ? 0 : 1;
                lines.push('disable wallpaper:i:' + wallpaper);
                const fontSmooth = document.getElementById('expFontSmooth').checked ? 1 : 0;
                if (fontSmooth !== 0) lines.push('allow font smoothing:i:' + fontSmooth);
                const fullDrag = document.getElementById('expFullDrag').checked ? 0 : 1;
                lines.push('disable full window drag:i:' + fullDrag);
                const menuAnim = document.getElementById('expMenuAnim').checked ? 0 : 1;
                lines.push('disable menu anims:i:' + menuAnim);
                const themes = document.getElementById('expThemes').checked ? 0 : 1;
                lines.push('disable themes:i:' + themes);
                const bitmapCache = document.getElementById('expBitmapCache').checked ? 1 : 0;
                if (bitmapCache !== 1) lines.push('bitmapcachepersistenable:i:' + bitmapCache);
            } else {
                // プリセット指定
                lines.push('connection type:i:' + ct);
                lines.push('networkautodetect:i:0');
                lines.push('bandwidthautodetect:i:0');
            }

            // autoreconnection enabled Default:1
            const autoRecon = document.getElementById('autoReconnect').checked ? 1 : 0;
            if (autoRecon !== 1) lines.push('autoreconnection enabled:i:' + autoRecon);

            // ── 詳細設定
            // authentication level Default:3 → ここでは2を推奨デフォルト
            const authLv = document.getElementById('authLevel').value;
            lines.push('authentication level:i:' + authLv);

            // RDゲートウェイ
            const gwUsage = document.getElementById('gatewayUsage').value;
            if (gwUsage !== '0') {
                lines.push('gatewayusagemethod:i:' + gwUsage);
                const gwHost = document.getElementById('gatewayHost').value.trim();
                if (gwHost) lines.push('gatewayhostname:s:' + gwHost);
                const promptOnce = document.getElementById('promptCredentialOnce').checked ? 1 : 0;
                if (promptOnce !== 1) lines.push('promptcredentialonce:i:' + promptOnce);
                const gwUser = document.getElementById('gatewayUsername').value.trim();
                if (gwUser) lines.push('gatewayusername:s:' + gwUser);
                const gwDomain = document.getElementById('gatewayDomain').value.trim();
                if (gwDomain) lines.push('gatewaydomain:s:' + gwDomain);
                const gwCredSrc = document.getElementById('gatewayCredSource').value;
                lines.push('gatewaycredentialssource:i:' + gwCredSrc);
                lines.push('gatewayprofileusagemethod:i:1');
            }

            return lines.join('\r\n');
        }

        function createCard(filename, host, content) {
            const div = document.createElement('div');
            div.className = 'card';
            const safeContent = escapeHtml(content);
            const rawContentBase64 = btoa(unescape(encodeURIComponent(content))); // utf8-safe base64
            
            div.innerHTML = `
                <div class="card-header">
                    <div class="card-title">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color:var(--accent);"><rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect><line x1="8" y1="21" x2="16" y2="21"></line><line x1="12" y1="17" x2="12" y2="21"></line></svg>
                        ${escapeHtml(filename)}.rdp
                    </div>
                    <button class="btn btn-accent" style="flex:none; padding:4px 10px; font-size:11px;" onclick="downloadRDP('${escapeHtml(filename)}', '${rawContentBase64}')">📥 RDPファイルをダウンロード</button>
                </div>
                <div class="card-body">
                    <div class="card-host" style="margin-bottom:8px;">Target: ${escapeHtml(host)}</div>
                    <details class="card-details">
                        <summary>RDP設定プレビュー</summary>
                        <pre class="card-code">${safeContent}</pre>
                    </details>
                </div>
            `;
            return div;
        }

        function downloadRDP(filename, base64Content) {
            try {
                const content = decodeURIComponent(escape(atob(base64Content)));
                const blob = new Blob([content], { type: 'application/x-rdp' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = filename + '.rdp';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
                showToast(filename + '.rdp をダウンロードしました');
            } catch (e) {
                console.error(e);
                showToast('ダウンロードに失敗しました');
            }
        }

        // ── 初期化
        window.onload = () => {
            onPromptCredentialOnceChange();
            updateAll();
        };
    </script>
  <script src="../assets/js/nav.js"></script>
</body>
</html>
