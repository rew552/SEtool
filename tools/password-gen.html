<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Password Generator</title>
    <link rel="stylesheet" href="../assets/css/common.css">
  <link rel="stylesheet" href="../assets/css/nav.css">
  <style>


    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── Header ── */
    header {
      display: flex;
      align-items: center;
      padding: 10px 18px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .logo {
      font-family: var(--mono);
      font-size: 15px;
      font-weight: 600;
      color: var(--accent);
    }

    .logo span {
      color: var(--accent2);
    }

    /* ── Layout ── */
    main {
      display: grid;
      grid-template-columns: 300px 1fr;
      flex: 1;
      overflow: hidden;
      min-height: 0;
    }

    .pane-left {
      display: flex;
      flex-direction: column;
      border-right: 1px solid var(--border);
      overflow-y: auto;
      background: var(--surface);
    }

    .pane-right {
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .pane-header {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 5px 12px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
      min-height: 30px;
      font-size: 11px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }

    .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent);
      flex-shrink: 0;
    }

    .dot.green {
      background: var(--accent2);
    }

    /* ── Tab bar ── */
    .tab-bar {
      display: flex;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .tab {
      padding: 7px 20px;
      font-size: 12px;
      color: var(--muted);
      cursor: pointer;
      border-bottom: 2px solid transparent;
      user-select: none;
      transition: color .15s;
    }

    .tab:hover {
      color: var(--text);
    }

    .tab.active {
      color: var(--text);
      border-bottom-color: var(--accent);
    }

    /* ── Section ── */
    .section {
      padding: 14px 14px 4px;
    }

    .section-label {
      font-size: 10px;
      color: var(--dim);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 10px;
      padding-bottom: 4px;
      border-bottom: 1px solid var(--border);
    }

    /* ── Control row ── */
    .control-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
      gap: 8px;
    }

    .control-label {
      font-size: 12px;
      color: var(--text);
    }

    .control-sub {
      font-size: 11px;
      color: var(--muted);
      margin-top: 1px;
    }

    /* Toggle */
    .toggle {
      position: relative;
      width: 36px;
      height: 20px;
      flex-shrink: 0;
      cursor: pointer;
    }

    .toggle input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .toggle-track {
      position: absolute;
      inset: 0;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 10px;
      transition: background .15s, border-color .15s;
    }

    .toggle-thumb {
      position: absolute;
      top: 3px;
      left: 3px;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--muted);
      transition: transform .15s, background .15s;
    }

    .toggle input:checked+.toggle-track {
      background: var(--accent);
      border-color: var(--accent);
    }

    .toggle input:checked+.toggle-track+.toggle-thumb {
      transform: translateX(16px);
      background: #ffffff; /* Contrast against accent colored track */
    }

    /* Slider */
    .slider-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
      flex: 1;
    }

    input[type="range"] {
      -webkit-appearance: none;
      flex: 1;
      height: 4px;
      background: var(--surface2);
      border-radius: 2px;
      outline: none;
      cursor: pointer;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--accent);
      cursor: pointer;
    }

    .slider-val {
      font-family: var(--mono);
      font-size: 12px;
      color: var(--text);
      min-width: 28px;
      text-align: right;
    }

    /* Number stepper */
    .num-input {
      display: flex;
      align-items: center;
      border: 1px solid var(--border);
      border-radius: 3px;
      overflow: hidden;
      flex-shrink: 0;
    }

    .num-btn {
      width: 24px;
      height: 26px;
      background: var(--surface2);
      color: var(--muted);
      border: none;
      cursor: pointer;
      font-size: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color .1s;
      font-family: var(--mono);
    }

    .num-btn:hover {
      color: var(--text);
    }

    .num-val {
      width: 36px;
      background: var(--surface2);
      color: var(--text);
      border: none;
      border-left: 1px solid var(--border);
      border-right: 1px solid var(--border);
      text-align: center;
      font-family: var(--mono);
      font-size: 12px;
      padding: 4px 2px;
      outline: none;
      -webkit-appearance: none;
    }

    /* 記号チェックボックスグリッド */
    .sym-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      margin-bottom: 8px;
    }

    .sym-btn {
      width: 28px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 3px;
      font-family: var(--mono);
      font-size: 13px;
      color: var(--muted);
      cursor: pointer;
      user-select: none;
      transition: color .1s, border-color .1s, background .1s;
    }

    .sym-btn.on {
      color: var(--accent);
      border-color: var(--accent);
      background: var(--surface);
    }

    .sym-quick {
      display: flex;
      gap: 6px;
      margin-bottom: 10px;
    }

    .sym-quick-btn {
      font-size: 11px;
      color: var(--muted);
      background: none;
      border: none;
      cursor: pointer;
      padding: 0;
      text-decoration: underline;
      font-family: var(--sans);
    }

    .sym-quick-btn:hover {
      color: var(--text);
    }

    /* Generate button */
    .gen-btn {
      display: block;
      width: calc(100% - 28px);
      margin: 14px;
      padding: 8px 0;
      background: var(--accent);
      color: #ffffff;
      border: none;
      border-radius: 3px;
      font-family: var(--sans);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity .15s;
    }

    .gen-btn:hover {
      opacity: 0.88;
    }

    /* ── Password list ── */
    .pw-list {
      flex: 1;
      overflow-y: auto;
      padding: 12px 14px;
    }

    .pw-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 12px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 4px;
      margin-bottom: 8px;
    }

    .pw-text {
      flex: 1;
      font-family: var(--mono);
      font-size: 14px;
      color: var(--text);
      word-break: break-all;
      line-height: 1.5;
      user-select: all;
    }

    .pw-meta {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 4px;
      flex-shrink: 0;
    }

    .strength-bar {
      display: flex;
      gap: 3px;
    }

    .strength-seg {
      width: 16px;
      height: 4px;
      border-radius: 2px;
      background: var(--border);
      transition: background .2s;
    }

    .entropy-label {
      font-size: 10px;
      color: var(--dim);
      font-family: var(--mono);
    }

    .copy-btn {
      padding: 3px 10px;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 3px;
      color: var(--muted);
      font-family: var(--sans);
      font-size: 11px;
      cursor: pointer;
      white-space: nowrap;
      transition: color .1s, border-color .1s;
    }

    .copy-btn:hover {
      color: var(--text);
      border-color: var(--dim);
    }

    .copy-btn.copied {
      color: var(--accent2);
      border-color: var(--accent2);
    }

    .copy-all-btn {
      display: inline-flex;
      align-items: center;
      padding: 3px 10px;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 3px;
      color: var(--muted);
      font-family: var(--sans);
      font-size: 11px;
      cursor: pointer;
      margin-left: auto;
      transition: color .1s, border-color .1s;
    }

    .copy-all-btn:hover {
      color: var(--text);
      border-color: var(--dim);
    }

    .tab-panel {
      display: none;
    }

    .tab-panel.active {
      display: block;
    }

    .empty-hint {
      color: var(--dim);
      font-size: 12px;
      text-align: center;
      padding: 40px 0;
      font-style: italic;
    }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 18px;
      right: 18px;
      padding: 7px 14px;
      background: var(--surface2);
      border: 1px solid var(--accent2);
      border-radius: 3px;
      font-size: 12px;
      color: var(--accent2);
      opacity: 0;
      pointer-events: none;
      z-index: 999;
      transition: opacity .18s;
    }

    .toast.show {
      opacity: 1;
    }
  </style>
</head>

<body>

  <header>
    <div class="logo">password<span>.gen</span></div>
  </header>

  <main>
    <!-- 左: 設定 -->
    <div class="pane-left">
      <div class="pane-header"><span class="dot"></span>SETTINGS</div>

      <div class="tab-bar">
        <div class="tab active" data-tab="random" onclick="switchTab('random')">ランダム</div>
        <div class="tab" data-tab="pin" onclick="switchTab('pin')">PIN</div>
      </div>

      <!-- ランダム -->
      <div class="tab-panel active" id="panel-random">

        <div class="section">
          <div class="section-label">長さ</div>
          <div class="control-row">
            <div class="slider-wrap">
              <input type="range" id="r-len" min="4" max="64" value="16"
                oninput="onSlider('r-len','r-len-n','r-len-disp')">
              <span class="slider-val" id="r-len-disp">16</span>
            </div>
            <div class="num-input">
              <button class="num-btn" onclick="step('r-len','r-len-n','r-len-disp',-1)">&#x2212;</button>
              <input class="num-val" id="r-len-n" type="number" value="16" min="4" max="64"
                oninput="onNumInput('r-len-n','r-len','r-len-disp')">
              <button class="num-btn" onclick="step('r-len','r-len-n','r-len-disp',1)">&#x002B;</button>
            </div>
          </div>
        </div>

        <div class="section">
          <div class="section-label">文字種</div>
          <div class="control-row">
            <div class="control-label">大文字 (A&#x2013;Z)</div>
            <label class="toggle">
              <input type="checkbox" id="r-upper" checked onchange="autoGen()">
              <div class="toggle-track"></div>
              <div class="toggle-thumb"></div>
            </label>
          </div>
          <div class="control-row">
            <div class="control-label">小文字 (a&#x2013;z)</div>
            <label class="toggle">
              <input type="checkbox" id="r-lower" checked onchange="autoGen()">
              <div class="toggle-track"></div>
              <div class="toggle-thumb"></div>
            </label>
          </div>
          <div class="control-row">
            <div class="control-label">数字 (0&#x2013;9)</div>
            <label class="toggle">
              <input type="checkbox" id="r-num" checked onchange="autoGen()">
              <div class="toggle-track"></div>
              <div class="toggle-thumb"></div>
            </label>
          </div>
          <div class="control-row">
            <div class="control-label">記号</div>
            <label class="toggle">
              <input type="checkbox" id="r-sym" checked onchange="onSymToggle()">
              <div class="toggle-track"></div>
              <div class="toggle-thumb"></div>
            </label>
          </div>

          <!-- 記号選択グリッド -->
          <div id="sym-section">
            <div class="sym-quick">
              <button class="sym-quick-btn" onclick="symAll(true)">すべて選択</button>
              <button class="sym-quick-btn" onclick="symAll(false)">すべて解除</button>
              <button class="sym-quick-btn" onclick="symPreset('common')">よく使う</button>
            </div>
            <div class="sym-grid" id="sym-grid"></div>
          </div>

          <div class="control-row" style="margin-top:4px">
            <div>
              <div class="control-label">紛らわしい文字を除外</div>
              <div class="control-sub">0 O l 1 I など</div>
            </div>
            <label class="toggle">
              <input type="checkbox" id="r-excl" onchange="autoGen()">
              <div class="toggle-track"></div>
              <div class="toggle-thumb"></div>
            </label>
          </div>
        </div>

        <div class="section">
          <div class="section-label">生成数</div>
          <div class="control-row">
            <div class="control-label">一度に生成する数</div>
            <div class="num-input">
              <button class="num-btn" onclick="stepCount('r-count',-1)">&#x2212;</button>
              <input class="num-val" id="r-count" type="number" value="5" min="1" max="20" oninput="autoGen()">
              <button class="num-btn" onclick="stepCount('r-count',1)">&#x002B;</button>
            </div>
          </div>
        </div>
      </div>

      <!-- PIN -->
      <div class="tab-panel" id="panel-pin">

        <div class="section">
          <div class="section-label">桁数</div>
          <div class="control-row">
            <div class="slider-wrap">
              <input type="range" id="p-len" min="4" max="12" value="6"
                oninput="onSlider('p-len','p-len-n','p-len-disp')">
              <span class="slider-val" id="p-len-disp">6</span>
            </div>
            <div class="num-input">
              <button class="num-btn" onclick="step('p-len','p-len-n','p-len-disp',-1)">&#x2212;</button>
              <input class="num-val" id="p-len-n" type="number" value="6" min="4" max="12"
                oninput="onNumInput('p-len-n','p-len','p-len-disp')">
              <button class="num-btn" onclick="step('p-len','p-len-n','p-len-disp',1)">&#x002B;</button>
            </div>
          </div>
        </div>

        <div class="section">
          <div class="section-label">オプション</div>
          <div class="control-row">
            <div class="control-label">同じ数字を連続させない</div>
            <label class="toggle">
              <input type="checkbox" id="p-norepeat" onchange="autoGen()">
              <div class="toggle-track"></div>
              <div class="toggle-thumb"></div>
            </label>
          </div>
        </div>

        <div class="section">
          <div class="section-label">生成数</div>
          <div class="control-row">
            <div class="control-label">一度に生成する数</div>
            <div class="num-input">
              <button class="num-btn" onclick="stepCount('p-count',-1)">&#x2212;</button>
              <input class="num-val" id="p-count" type="number" value="5" min="1" max="20" oninput="autoGen()">
              <button class="num-btn" onclick="stepCount('p-count',1)">&#x002B;</button>
            </div>
          </div>
        </div>
      </div>

      <button class="gen-btn" onclick="generate()">生成</button>
    </div>

    <!-- 右: 出力 -->
    <div class="pane-right">
      <div class="pane-header">
        <span class="dot green"></span>GENERATED PASSWORDS
        <button class="copy-all-btn" onclick="copyAll()">すべてコピー</button>
      </div>
      <div class="pw-list" id="pwList">
        <div class="empty-hint">左側で設定して「生成」を押してください</div>
      </div>
    </div>
  </main>

  <div class="toast" id="toast"></div>

  <script>
    // ================================================================
    //  定数
    // ================================================================
    var UPPER = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
    var LOWER = 'abcdefghijklmnopqrstuvwxyz';
    var DIGITS = '0123456789';
    var AMBIGUOUS = /[0Ol1I]/g;

    // 記号を用途別グループで定義
    var SYM_GROUPS = [
      { label: '括弧', chars: ['(', ')', '[', ']', '{', '}', '<', '>'] },
      { label: '算術', chars: ['+', '-', '*', '/', '=', '%', '^', '~'] },
      { label: '句読点', chars: ['!', '?', '.', ',', ':', ';'] },
      { label: 'その他', chars: ['@', '#', '$', '&', '_', '|', '\\', '\'', '"', '`'] }
    ];

    // よく使う記号のプリセット
    var SYM_COMMON = ['!', '@', '#', '$', '%', '&', '*', '-', '_', '.'];

    var STRENGTH_COLORS = ['var(--str0)', 'var(--str1)', 'var(--str2)', 'var(--str3)', 'var(--str4)'];
    var STRENGTH_LABELS = ['非常に弱い', '弱い', '普通', '強い', '非常に強い'];

    // ================================================================
    //  乱数（crypto API）
    // ================================================================
    function randInt(n) {
      var arr = new Uint32Array(1);
      crypto.getRandomValues(arr);
      return arr[0] % n;
    }

    function shuffle(arr) {
      for (var i = arr.length - 1; i > 0; i--) {
        var j = randInt(i + 1);
        var t = arr[i]; arr[i] = arr[j]; arr[j] = t;
      }
      return arr;
    }

    function pickOne(str) { return str[randInt(str.length)]; }

    // ================================================================
    //  記号グリッドの初期化
    // ================================================================
    function buildSymGrid() {
      var grid = document.getElementById('sym-grid');
      var html = '';
      for (var g = 0; g < SYM_GROUPS.length; g++) {
        var chars = SYM_GROUPS[g].chars;
        for (var c = 0; c < chars.length; c++) {
          var ch = chars[c];
          var isOn = SYM_COMMON.indexOf(ch) >= 0;
          html += '<div class="sym-btn' + (isOn ? ' on' : '') + '" data-sym="' + escAttr(ch) + '" onclick="toggleSym(this)">' + esc(ch) + '</div>';
        }
      }
      grid.innerHTML = html;
    }

    function toggleSym(el) {
      el.classList.toggle('on');
      autoGen();
    }

    function symAll(on) {
      var btns = document.querySelectorAll('#sym-grid .sym-btn');
      for (var i = 0; i < btns.length; i++) {
        btns[i].classList.toggle('on', on);
      }
      autoGen();
    }

    function symPreset(name) {
      var btns = document.querySelectorAll('#sym-grid .sym-btn');
      for (var i = 0; i < btns.length; i++) {
        var ch = btns[i].getAttribute('data-sym');
        btns[i].classList.toggle('on', SYM_COMMON.indexOf(ch) >= 0);
      }
      autoGen();
    }

    function getSelectedSymbols() {
      var btns = document.querySelectorAll('#sym-grid .sym-btn.on');
      var str = '';
      for (var i = 0; i < btns.length; i++) { str += btns[i].getAttribute('data-sym'); }
      return str;
    }

    function onSymToggle() {
      var on = document.getElementById('r-sym').checked;
      document.getElementById('sym-section').style.display = on ? 'block' : 'none';
      autoGen();
    }

    // ================================================================
    //  タブ切替
    // ================================================================
    var currentTab = 'random';

    function switchTab(tab) {
      currentTab = tab;
      var tabs = document.querySelectorAll('.tab');
      for (var i = 0; i < tabs.length; i++) {
        tabs[i].classList.toggle('active', tabs[i].getAttribute('data-tab') === tab);
      }
      var panels = document.querySelectorAll('.tab-panel');
      for (var i = 0; i < panels.length; i++) {
        panels[i].classList.toggle('active', panels[i].id === 'panel-' + tab);
      }
      autoGen();
    }

    // ================================================================
    //  スライダー / ステッパー
    // ================================================================
    function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }

    function onSlider(sliderId, numId, dispId) {
      var val = parseInt(document.getElementById(sliderId).value, 10);
      document.getElementById(numId).value = val;
      document.getElementById(dispId).textContent = val;
      autoGen();
    }

    function onNumInput(numId, sliderId, dispId) {
      var el = document.getElementById(numId);
      var val = parseInt(el.value, 10);
      var min = parseInt(el.min, 10);
      var max = parseInt(el.max, 10);
      if (isNaN(val)) { return; }
      val = clamp(val, min, max);
      document.getElementById(sliderId).value = val;
      document.getElementById(dispId).textContent = val;
      autoGen();
    }

    function step(sliderId, numId, dispId, delta) {
      var el = document.getElementById(sliderId);
      var val = clamp(parseInt(el.value, 10) + delta, parseInt(el.min, 10), parseInt(el.max, 10));
      el.value = val;
      document.getElementById(numId).value = val;
      document.getElementById(dispId).textContent = val;
      autoGen();
    }

    function stepCount(numId, delta) {
      var el = document.getElementById(numId);
      var val = clamp(parseInt(el.value, 10) + delta, 1, 20);
      el.value = val;
      autoGen();
    }

    function getLen(sliderId) { return parseInt(document.getElementById(sliderId).value, 10); }
    function getCount(numId) { var v = parseInt(document.getElementById(numId).value, 10); return (isNaN(v) || v < 1) ? 1 : Math.min(v, 20); }

    // ================================================================
    //  パスワード生成
    // ================================================================
    function genRandom() {
      var len = getLen('r-len');
      var upper = document.getElementById('r-upper').checked;
      var lower = document.getElementById('r-lower').checked;
      var num = document.getElementById('r-num').checked;
      var sym = document.getElementById('r-sym').checked;
      var excl = document.getElementById('r-excl').checked;
      var symChars = sym ? getSelectedSymbols() : '';

      var re = excl ? AMBIGUOUS : null;
      var applyExcl = function (s) { return re ? s.replace(re, '') : s; };

      var pool = '';
      if (upper) { pool += applyExcl(UPPER); }
      if (lower) { pool += applyExcl(LOWER); }
      if (num) { pool += applyExcl(DIGITS); }
      if (sym && symChars) { pool += applyExcl(symChars); }
      if (!pool) { pool = LOWER; }

      // 各文字種を最低1文字保証
      var required = [];
      if (upper && applyExcl(UPPER)) { required.push(pickOne(applyExcl(UPPER))); }
      if (lower && applyExcl(LOWER)) { required.push(pickOne(applyExcl(LOWER))); }
      if (num && applyExcl(DIGITS)) { required.push(pickOne(applyExcl(DIGITS))); }
      if (sym && symChars && applyExcl(symChars)) { required.push(pickOne(applyExcl(symChars))); }

      var chars = required.slice(0, len);
      while (chars.length < len) { chars.push(pool[randInt(pool.length)]); }
      return shuffle(chars).join('');
    }

    function genPIN() {
      var len = getLen('p-len');
      var norepeat = document.getElementById('p-norepeat').checked;
      var digits = [];
      var prev = -1;
      for (var i = 0; i < len; i++) {
        var d;
        do { d = randInt(10); } while (norepeat && d === prev);
        digits.push(d);
        prev = d;
      }
      return digits.join('');
    }

    // ================================================================
    //  エントロピー / 強度
    // ================================================================
    function calcEntropy(pw) {
      var pool = 0;
      if (/[A-Z]/.test(pw)) { pool += 26; }
      if (/[a-z]/.test(pw)) { pool += 26; }
      if (/[0-9]/.test(pw)) { pool += 10; }
      if (/[^A-Za-z0-9]/.test(pw)) { pool += 32; }
      return pool > 0 ? Math.floor(pw.length * Math.log2(pool)) : 0;
    }

    function strengthScore(bits) {
      if (bits < 28) { return 0; }
      if (bits < 36) { return 1; }
      if (bits < 60) { return 2; }
      if (bits < 80) { return 3; }
      return 4;
    }

    // ================================================================
    //  描画
    // ================================================================
    function renderPasswords(list) {
      var container = document.getElementById('pwList');
      if (!list.length) {
        container.innerHTML = '<div class="empty-hint">パスワードを生成できませんでした</div>';
        return;
      }
      var html = '';
      for (var i = 0; i < list.length; i++) {
        var pw = list[i];
        var bits = calcEntropy(pw);
        var sc = strengthScore(bits);
        var col = STRENGTH_COLORS[sc];
        var segs = '';
        for (var s = 0; s < 5; s++) {
          segs += '<div class="strength-seg" style="background:' + (s <= sc ? col : 'var(--border)') + '"></div>';
        }
        // コピーボタンの onclick に渡す文字列はエスケープが必要
        var escapedPw = pw.replace(/\\/g, '\\\\').replace(/'/g, "\\'");
        html +=
          '<div class="pw-item">' +
          '<div class="pw-text">' + esc(pw) + '</div>' +
          '<div class="pw-meta">' +
          '<div class="strength-bar">' + segs + '</div>' +
          '<div class="entropy-label" style="color:' + col + '">' + STRENGTH_LABELS[sc] + ' (' + bits + ' bit)</div>' +
          '<button class="copy-btn" onclick="copyPw(this,\'' + escapedPw + '\')">コピー</button>' +
          '</div>' +
          '</div>';
      }
      container.innerHTML = html;
    }

    // ================================================================
    //  エントリポイント
    // ================================================================
    function generate() {
      var list = [];
      try {
        if (currentTab === 'random') {
          var n = getCount('r-count');
          for (var i = 0; i < n; i++) { list.push(genRandom()); }
        } else {
          var n = getCount('p-count');
          for (var i = 0; i < n; i++) { list.push(genPIN()); }
        }
      } catch (e) {
        console.error(e);
      }
      renderPasswords(list);
    }

    function autoGen() { generate(); }

    // ================================================================
    //  クリップボード
    // ================================================================
    function copyPw(btn, pw) {
      writeClip(pw, function () {
        btn.textContent = 'コピー済';
        btn.classList.add('copied');
        setTimeout(function () { btn.textContent = 'コピー'; btn.classList.remove('copied'); }, 1500);
      });
    }

    function copyAll() {
      var items = document.querySelectorAll('.pw-text');
      if (!items.length) { return; }
      var text = '';
      for (var i = 0; i < items.length; i++) { text += items[i].textContent + '\n'; }
      writeClip(text.trim(), function () { showToast('すべてコピーしました'); });
    }

    function writeClip(text, onSuccess) {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(onSuccess, function () { fallbackCopy(text, onSuccess); });
      } else {
        fallbackCopy(text, onSuccess);
      }
    }

    function fallbackCopy(text, onSuccess) {
      var ta = document.createElement('textarea');
      ta.value = text;
      ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0';
      document.body.appendChild(ta);
      ta.focus(); ta.select();
      try { document.execCommand('copy'); onSuccess(); }
      catch (e) { showToast('コピーできませんでした'); }
      document.body.removeChild(ta);
    }

    function showToast(msg) {
      var t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      if (t._tid) { clearTimeout(t._tid); }
      t._tid = setTimeout(function () { t.classList.remove('show'); }, 2000);
    }

    // ================================================================
    //  ヘルパー
    // ================================================================
    function esc(s) {
      return String(s)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function escAttr(s) {
      return String(s)
        .replace(/&/g, '&amp;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    // ================================================================
    //  初期化
    // ================================================================
    buildSymGrid();
    generate();
  </script>
  <script src="../assets/js/nav.js"></script>
</body>
